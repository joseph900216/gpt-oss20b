server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # dev mode, replace with 'validate' in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true